<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Custom Mapbox Map</title>
  <!-- Mapbox GL JS の読み込み -->
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // Mapbox アクセストークン
  mapboxgl.accessToken = 'pk.eyJ1IjoibWMxZHBiYWJnb2d1IiwiYSI6ImNtdWg0NmhhbDAxZ3YzNHBxc2R2d25pZXUifQ.jco9CKcl7GfcSr2Lh79gLA';

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mc1dpbabgogu/cmumrim97003901sl30ltg4o2',
    center: [139.7671, 35.6812], // [経度, 緯度] (東京駅付近)
    zoom: 12
  });

  // Google Map風のナビゲーションコントロール（拡大・縮小・コンパス）を追加
  map.addControl(new mapboxgl.NavigationControl());
</script>

</body>
</html>
