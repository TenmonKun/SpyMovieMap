<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Guides</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

<!-- Mapbox GL Directions プラグイン -->
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.3.1/mapbox-gl-directions.js"></script>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.3.1/mapbox-gl-directions.css" type="text/css">

<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibWMxZHBiYWJnb2d1IiwiYSI6ImNtdWg0NmhhbDAxZ3YzNHBxc2R2d25pZXUifQ.jco9CKcl7GfcSr2Lh79gLA';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mc1dpbabgogu/cmumrim97003901sl30ltg4o2',
        projection: 'mercator',
        zoom: 11,
        center: [77.2090, 28.6139]
    });

    map.addControl(new mapboxgl.NavigationControl());

    // カスタムスタイルの定義
    const customRouteStyles = [
        // 1. ルートの下地（枠線/シャドウ効果）
        {
            'id': 'directions-route-line-casing',
            'type': 'line',
            'source': 'directions',
            'layout': {
                'line-cap': 'round',
                'line-join': 'round'
            },
            'paint': {
                'line-color': '#2d3748', // 枠線の色（ダークグレー）
                'line-width': 9,          // 線幅
                'line-opacity': 0.8
            },
            'filter': ['all', ['in', '$type', 'LineString'], ['in', 'route', 'selected']]
        },
        // 2. メインのルート線
        {
            'id': 'directions-route-line',
            'type': 'line',
            'source': 'directions',
            'layout': {
                'line-cap': 'round',
                'line-join': 'round'
            },
            'paint': {
                'line-color': '#007cbf', // ルート線のメインカラー（青）
                'line-width': 6,          // 太さ
                'line-opacity': 0.95
            },
            'filter': ['all', ['in', '$type', 'LineString'], ['in', 'route', 'selected']]
        },
        // 3. 代替ルート線（複数検索結果が出た場合の非選択ルート）
        {
            'id': 'directions-route-line-alt',
            'type': 'line',
            'source': 'directions',
            'layout': {
                'line-cap': 'round',
                'line-join': 'round'
            },
            'paint': {
                'line-color': '#a0aec0', // グレー
                'line-width': 5,
                'line-dasharray': [2, 2] // 破線指定
            },
            'filter': ['all', ['in', '$type', 'LineString'], ['in', 'route', 'alternate']]
        }
    ];

    const directions = new MapboxDirections({
        accessToken: mapboxgl.accessToken,
        unit: 'metric',
        profile: 'mapbox/driving',
        language: 'ja',
        styles: customRouteStyles // ここでカスタムスタイルを適用
    });

    map.addControl(directions, 'top-left');
</script>

</body>
</html>
