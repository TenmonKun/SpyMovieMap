<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Guides</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

<!-- Mapbox GL Directions プラグイン -->
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.3.1/mapbox-gl-directions.js"></script>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.3.1/mapbox-gl-directions.css" type="text/css">

<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibWMxZHBiYWJnb2d1IiwiYSI6ImNtdWg0NmhhbDAxZ3YzNHBxc2R2d25pZXUifQ.jco9CKcl7GfcSr2Lh79gLA';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mc1dpbabgogu/cmumrim97003901sl30ltg4o2',
        projection: 'mercator',
        zoom: 11,
        center: [77.2090, 28.6139]
    });

    map.addControl(new mapboxgl.NavigationControl());

    // 道案内コントロールの設定
    const directions = new MapboxDirections({
        accessToken: mapboxgl.accessToken,
        unit: 'metric',
        profile: 'mapbox/driving',
        language: 'ja'
    });

    map.addControl(directions, 'top-left');

    // ルートが計算・表示されたタイミングで直接線のスタイル（オレンジ・細線）を変更する
    map.on('style.load', () => {
        // メインルート線の色と太さを変更
        if (map.getLayer('directions-route-line')) {
            map.setPaintProperty('directions-route-line', 'line-color', '#FF6600'); // 鮮やかなオレンジ
            map.setPaintProperty('directions-route-line', 'line-width', 4);          // 細め（4px）
        }
        // 代替ルート線の色と太さを変更
        if (map.getLayer('directions-route-line-alt')) {
            map.setPaintProperty('directions-route-line-alt', 'line-color', '#FFA500'); // 薄めのオレンジ
            map.setPaintProperty('directions-route-line-alt', 'line-width', 3);          // さらに細め（3px）
        }
    });

    // ルート検索が実行された際にも確実にスタイルを適用
    directions.on('route', () => {
        if (map.getLayer('directions-route-line')) {
            map.setPaintProperty('directions-route-line', 'line-color', '#FF6600');
            map.setPaintProperty('directions-route-line', 'line-width', 4);
        }
        if (map.getLayer('directions-route-line-alt')) {
            map.setPaintProperty('directions-route-line-alt', 'line-color', '#FFA500');
            map.setPaintProperty('directions-route-line-alt', 'line-width', 3);
        }
    });
</script>

</body>
</html>
