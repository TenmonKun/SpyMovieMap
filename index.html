<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Guides</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

<!-- Mapbox GL Directions プラグイン -->
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.3.1/mapbox-gl-directions.js"></script>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.3.1/mapbox-gl-directions.css" type="text/css">

<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }

/* 下部の詳細ナビゲーション案内パネルを非表示にする */
.mapbox-directions-instructions {
    display: none !important;
}
</style>
</head>
<body>
<div id="map"></div>
<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibWMxZHBiYWJnb2d1IiwiYSI6ImNtdWg0NmhhbDAxZ3YzNHBxc2R2d25pZXUifQ.jco9CKcl7GfcSr2Lh79gLA';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mc1dpbabgogu/cmumrim97003901sl30ltg4o2',
        projection: 'mercator',
        zoom: 11,
        center: [77.2090, 28.6139]
    });

    // 右上のナビゲーションボタン（NavigationControl）は削除済み

    const directions = new MapboxDirections({
        accessToken: mapboxgl.accessToken,
        unit: 'metric',
        profile: 'mapbox/driving',
        language: 'ja'
    });

    map.addControl(directions, 'top-left');

    // カスタムスタイルの適用処理
    function applyCustomStyles() {
        // 1. 青い縁取り（外枠線）を非表示
        if (map.getLayer('directions-route-line-casing')) {
            map.setPaintProperty('directions-route-line-casing', 'line-width', 0);
        }
        if (map.getLayer('directions-route-line-alt-casing')) {
            map.setPaintProperty('directions-route-line-alt-casing', 'line-width', 0);
        }

        // 2. ルート線
        if (map.getLayer('directions-route-line')) {
            map.setPaintProperty('directions-route-line', 'line-color', '#ff210c');
            map.setPaintProperty('directions-route-line', 'line-width', 2);
        }
        if (map.getLayer('directions-route-line-alt')) {
            map.setPaintProperty('directions-route-line-alt', 'line-color', '#ff210c');
            map.setPaintProperty('directions-route-line-alt', 'line-width', 2);
        }

        // 3. A/B テキスト（文字）の消去
        const pointTextLayers = [
            'directions-origin-label',
            'directions-destination-label',
            'directions-waypoint-label'
        ];
        pointTextLayers.forEach(layerId => {
            if (map.getLayer(layerId)) {
                map.setLayoutProperty(layerId, 'text-field', '');
            }
        });

        // 4. A/B 丸のサイズ調整と塗りつぶし色・枠線色の設定 (#ff210c)
        const pointCircleLayers = [
            'directions-origin-point',
            'directions-destination-point',
            'directions-waypoint-point'
        ];
        pointCircleLayers.forEach(layerId => {
            if (map.getLayer(layerId)) {
                map.setPaintProperty(layerId, 'circle-radius', 5);
                map.setPaintProperty(layerId, 'circle-color', '#ff210c');
                map.setPaintProperty(layerId, 'circle-stroke-color', '#ff210c');
            }
        });
    }

    map.on('style.load', applyCustomStyles);
    directions.on('route', applyCustomStyles);
</script>

</body>
</html>
