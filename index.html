<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Guides</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.30.0/mapbox-gl.js"></script>

<!-- Mapbox GL Directions プラグイン -->
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.3.1/mapbox-gl-directions.js"></script>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.3.1/mapbox-gl-directions.css" type="text/css">

<style>
body { margin: 0; padding: 0; }
#map { position: absolute; top: 0; bottom: 0; width: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibWMxZHBiYWJnb2d1IiwiYSI6ImNtdWg0NmhhbDAxZ3YzNHBxc2R2d25pZXUifQ.jco9CKcl7GfcSr2Lh79gLA';

    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mc1dpbabgogu/cmumrim97003901sl30ltg4o2',
        projection: 'mercator',
        zoom: 11,
        center: [77.2090, 28.6139]
    });

    map.addControl(new mapboxgl.NavigationControl());

    map.addControl(new mapboxgl.GeolocateControl({
        positionOptions: { enableHighAccuracy: true },
        trackUserLocation: true,
        showUserHeading: true
    }));

    // ルート線のカスタマイズスタイル定義
    const customRouteStyles = [
        // 1. 代替ルート線（非アクティブ時）
        {
            'id': 'directions-route-line-alt',
            'type': 'line',
            'filter': [
                'all',
                ['==', '$type', 'LineString'],
                ['==', 'meta', 'route'],
                ['==', 'isAlternative', 'true']
            ],
            'layout': {
                'line-cap': 'round',
                'line-join': 'round'
            },
            'paint': {
                'line-color': '#FFA500', // 薄め・半透明のオレンジ
                'line-width': 3,         // 線幅（細め）
                'line-opacity': 0.6
            }
        },
        // 2. メインルート線（アクティブ時）
        {
            'id': 'directions-route-line',
            'type': 'line',
            'filter': [
                'all',
                ['==', '$type', 'LineString'],
                ['==', 'meta', 'route'],
                ['!=', 'isAlternative', 'true']
            ],
            'layout': {
                'line-cap': 'round',
                'line-join': 'round'
            },
            'paint': {
                'line-color': '#FF6600', // 鮮やかなオレンジ
                'line-width': 5          // 線幅（メインルート）
            }
        }
    ];

    // 道案内コントロールの初期化
    const directions = new MapboxDirections({
        accessToken: mapboxgl.accessToken,
        unit: 'metric',
        profile: 'mapbox/driving',
        language: 'ja',
        styles: customRouteStyles // カスタムスタイルをセット
    });

    map.addControl(directions, 'top-left');
</script>

</body>
</html>
